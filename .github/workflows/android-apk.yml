name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 把网页原样塞进 APK 的 assets/web，离线可用
      - name: Bundle web app into assets
        run: |
          set -e
          DEST=android/app/src/main/assets/web
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp index.html "$DEST/"
          cp manifest.webmanifest "$DEST/"
          cp -r assets "$DEST/assets"
          echo "bundled files:"
          find "$DEST" -type f | sed "s|$DEST/||" | sort

      # 首次运行生成签名密钥；之后复用仓库里那份，保证覆盖安装不报签名冲突
      - name: Prepare signing key
        working-directory: android/app
        run: |
          set -e
          if [ -f release.keystore ]; then
            echo "使用仓库内已有签名密钥"
          else
            echo "首次生成签名密钥"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Invisible Labor Ledger, OU=Personal, O=Personal, L=Shanghai, ST=Shanghai, C=CN"
          fi
          keytool -list -v -keystore release.keystore -storepass android -alias android | grep -E "SHA256|SHA1"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename artifacts
        run: |
          set -e
          ls -la android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk invisible-labor-ledger.apk
          cp android/app/release.keystore android/release.keystore
          ls -la invisible-labor-ledger.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: invisible-labor-ledger-apk
          path: |
            invisible-labor-ledger.apk
            android/release.keystore

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 隐形劳动账本 v1.0.0
          body: |
            安卓安装包（WebView 版，网页已内置，离线可用）。

            安装：下载 `invisible-labor-ledger.apk`，在手机上点开允许「安装未知来源应用」。

            数据只存在本机，卸载或清除应用数据前请先在「设置 → 导出 JSON」备份。
          files: invisible-labor-ledger.apk
          make_latest: true
