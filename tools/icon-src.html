<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1C1B19}
svg{display:block;width:100%;height:100%}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1C1B19"/>
  <!-- 账本外框 -->
  <rect x="88" y="88" width="336" height="336" fill="none" stroke="#F5F2EA" stroke-width="15"/>
  <!-- 内部分栏 -->
  <line x1="88" y1="172" x2="424" y2="172" stroke="#F5F2EA" stroke-opacity=".34" stroke-width="6"/>
  <line x1="172" y1="88" x2="172" y2="424" stroke="#F5F2EA" stroke-opacity=".34" stroke-width="6"/>
  <!-- 左上象限实心：可见的四分之一 -->
  <rect x="88" y="88" width="84" height="84" fill="#F5F2EA"/>
  <!-- 右下记账刻度 -->
  <line x1="212" y1="236" x2="384" y2="236" stroke="#F5F2EA" stroke-opacity=".55" stroke-width="7"/>
  <line x1="212" y1="300" x2="384" y2="300" stroke="#F5F2EA" stroke-opacity=".55" stroke-width="7"/>
  <line x1="212" y1="364" x2="308" y2="364" stroke="#F5F2EA" stroke-opacity=".55" stroke-width="7"/>
  <!-- 落款短线 -->
  <line x1="338" y1="364" x2="384" y2="364" stroke="#C2543C" stroke-width="9"/>
</svg>
</body></html>
