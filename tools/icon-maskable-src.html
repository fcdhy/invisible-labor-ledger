<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1C1B19}

</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1C1B19"/>

  <rect x="116" y="116" width="280" height="280" fill="none" stroke="#F5F2EA" stroke-width="13"/>

  <line x1="116" y1="186" x2="396" y2="186" stroke="#F5F2EA" stroke-opacity=".34" stroke-width="6"/>

  <rect x="116" y="116" width="70" height="70" fill="#F5F2EA"/>
  <!-- 右下记账刻度 -->
  <line x1="216" y1="242" x2="356" y2="242" stroke="#F5F2EA" stroke-opacity=".55" stroke-width="7"/>
  <line x1="216" y1="300" x2="356" y2="300" stroke="#F5F2EA" stroke-opacity=".55" stroke-width="7"/>
  <line x1="216" y1="358" x2="298" y2="358" stroke="#F5F2EA" stroke-opacity=".55" stroke-width="7"/>
  <!-- 落款短线 -->
  <line x1="332" y1="352" x2="356" y2="352" stroke="#C2543C" stroke-width="9"/>
</svg>
</body></html>
